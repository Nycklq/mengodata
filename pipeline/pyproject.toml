[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "flamengo-analytics-pipeline"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = ["pandas>=3,<4", "numpy>=2,<3", "pyarrow>=23,<24", "seaborn>=0.13,<0.14", "jsonschema[format]>=4.25,<5"]

[project.optional-dependencies]
dev = ["pytest>=9,<10", "ruff>=0.14,<1", "nbformat>=5,<6", "nbclient>=0.11,<1", "ipykernel>=7,<8", "matplotlib>=3.11,<4", "pypdf>=6,<7"]

[project.scripts]
flamengo-manifest = "flamengo_pipeline.main.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
