name: Quality
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
      - name: Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14'
      - run: npm ci
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install -r pipeline/requirements.lock.txt
      - run: .venv/bin/python -m pip install --no-deps -e pipeline
      - run: npm run pipeline:collective -- --input data/raw/collective/season=2025/competition=brasileirao-serie-a-men/0fcc4647256b2e1f58b50f1372b751aeb7e6aacb5b8cd747579dd7ab71303fbb.json
      - run: npm run collective:analyze
      - run: npm run lint
      - run: npm run lint:pipeline
      - run: npm run format:check
      - run: npm run format:pipeline:check
      - run: npm test
      - run: npm run test:pipeline
      - run: npm run test:database
      - run: npm run notebooks:check
      - run: npm run build
      - run: npm run test:smoke
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
        env:
          MENGODATA_BROWSER_CHANNEL: chromium
